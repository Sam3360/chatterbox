<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chatterbox</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Retro Terminal Header */
    .header {
      background: #111;
      border-bottom: 2px solid #00ff00;
      padding: 10px;
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 1px;
    }
    /* Main Screen Layout */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      height: calc(100vh - 45px);
    }
    /* Setup Screen */
    #setup-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      gap: 15px;
      text-align: center;
    }
    /* Chat Box - Takes Full Available Screen */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      gap: 10px;
    }
    #chat-box {
      flex: 1;
      border: 1px solid #00ff00;
      padding: 10px;
      overflow-y: auto;
      background-color: #050505;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    /* Input Form Controls */
    .input-group {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 600px;
    }
    #chat-screen .input-group {
      max-width: 100%;
    }
    input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid #00ff00;
      color: #00ff00;
      font-family: inherit;
      padding: 12px;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      background: #021202;
    }
    button {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:active {
      background: #009900;
    }
    /* Retro Message Styling */
    .msg { margin-bottom: 6px; word-break: break-word; }
    .msg-time { color: #555; font-size: 0.85rem; margin-right: 6px; }
    .msg-user { color: #00ffff; font-weight: bold; }
    .msg-self { color: #00ff00; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">=== CHATTERBOX [v1.0] ===</div>

  <div class="container">
    <!-- Screen 1: Login -->
    <div id="setup-screen">
      <p>> ENTER YOUR HANDLE TO CONNECT:</p>
      <div class="input-group">
        <input type="text" id="username-input" placeholder="handle..." maxlength="15" />
        <button id="join-btn">CONNECT</button>
      </div>
    </div>

    <!-- Screen 2: Main Terminal Chat -->
    <div id="chat-screen">
      <div id="chat-box"></div>
      <div class="input-group">
        <input type="text" id="message-input" placeholder="Type a message..." />
        <button id="send-btn">SEND</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, query, limitToLast, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Your requested Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBZ3CXKAK75vy4moBBw9A5qselZKqZ_Jlg",
      authDomain: "chatterbox-d8b59.firebaseapp.com",
      databaseURL: "https://chatterbox-d8b59-default-rtdb.firebaseio.com",
      projectId: "chatterbox-d8b59",
      storageBucket: "chatterbox-d8b59.firebasestorage.app",
      messagingSenderId: "394090730012",
      appId: "1:394090730012:web:f8bec87c4f4c69cafd45d9",
      measurementId: "G-B9Z9S8V9BY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    let username = '';

    function joinChat() {
      const uInput = document.getElementById('username-input').value.trim();
      if (!uInput) return;

      username = uInput;
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';

      const recentMessagesQuery = query(messagesRef, limitToLast(100));
      onChildAdded(recentMessagesQuery, (snapshot) => {
        const data = snapshot.val();
        appendChatMessage(data.username, data.text, data.time, data.username === username);
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      push(messagesRef, {
        username: username,
        text: text,
        time: time,
        createdAt: serverTimestamp()
      });

      input.value = '';
    }

    function appendChatMessage(user, text, time, isSelf) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg';
      
      const userSpan = isSelf 
        ? '<span class="msg-self">&lt;' + escapeHtml(user) + '&gt;</span>' 
        : '<span class="msg-user">&lt;' + escapeHtml(user) + '&gt;</span>';

      div.innerHTML = '<span class="msg-time">[' + time + ']</span> ' + userSpan + ' ' + escapeHtml(text);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('join-btn').addEventListener('click', joinChat);
    document.getElementById('send-btn').addEventListener('click', sendMessage);

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('setup-screen').style.display !== 'none') {
          joinChat();
        } else {
          sendMessage();
        }
      }
    });
  </script>
</body>
</html>
